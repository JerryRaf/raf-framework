name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'raf-framework-*/**'
      - 'pom.xml'
      - '.github/workflows/**'
    branches:
      - "master"
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn clean test --no-transfer-progress
