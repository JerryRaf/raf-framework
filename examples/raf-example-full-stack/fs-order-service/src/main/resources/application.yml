spring:
  application:
    name: fs-order-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fullstack_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8083

dubbo:
  registry:
    address: nacos://${NACOS_ADDR:127.0.0.1:8848}
  consumer:
    check: false

rocketmq:
  name-server: ${ROCKETMQ_ADDR:localhost:9876}
  producer:
    group: order-producer-group

seata:
  enabled: true
  tx-service-group: order-service-group
  service:
    vgroup-mapping:
      order-service-group: default
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      group: SEATA_GROUP
