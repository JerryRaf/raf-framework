spring:
  application:
    name: product-service-example
  datasource:
    url: jdbc:mysql://${MYSQL_PRODUCT_HOST:localhost}:${MYSQL_PRODUCT_PORT:3307}/product_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8082

dubbo:
  registry:
    address: nacos://${NACOS_ADDR:127.0.0.1:8848}
    parameters:
      namespace: ${NACOS_NAMESPACE:public}
  protocol:
    name: dubbo
    port: 20881
  scan:
    base-packages: io.github.jerryraf.examples.tx.product

seata:
  enabled: true
  tx-service-group: product-service-group
  service:
    vgroup-mapping:
      product-service-group: default
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group: SEATA_GROUP
