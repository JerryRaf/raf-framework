server:
  port: 8080

spring:
  application:
    name: raf-example-ai

raf:
  ai:
    enabled: true
    default-provider: deepseek

    # 场景路由示例
    routes:
      code: claude
      summary: openai

    # 会话配置
    session:
      max-history: 20
      ttl: 3600

    # Provider 配置（API Key 通过环境变量注入）
    providers:
      openai:
        enabled: true
        api-key: ${OPENAI_API_KEY:sk-placeholder}
        base-url: https://api.openai.com/v1
        model: gpt-4o
        temperature: 0.7
        max-tokens: 4096
        timeout: 60

      claude:
        enabled: true
        api-key: ${ANTHROPIC_API_KEY:sk-placeholder}
        base-url: https://api.anthropic.com
        model: claude-opus-4-5
        temperature: 0.7
        max-tokens: 4096
        timeout: 60

      deepseek:
        enabled: true
        api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
        base-url: https://api.deepseek.com/v1
        model: deepseek-chat
        temperature: 0.7
        max-tokens: 4096
        timeout: 60

logging:
  level:
    com.raf: DEBUG
